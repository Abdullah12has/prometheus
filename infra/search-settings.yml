use_default_settings: true
server:
  limiter: false
  image_proxy: false
search:
  formats:
    - html
    - json
# Keep general search usable when other providers return quota/CAPTCHA errors.
engines:
  - name: yahoo
    disabled: false
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: google cse
    disabled: true
